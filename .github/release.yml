changelog:
  exclude:
    authors:
      - dependabot[bot]
      - pre-commit-ci[bot]
    labels:
      - no-changelog-entry-needed
      - skip-changelog

  categories:
    - title: Bug Fixes
      labels:
        - bug
    - title: New Features
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Performance
      labels:
        - performance
    - title: Other Changes
      labels:
        - "*"
